    <body>
   
        <div class="bg-info w-75 m-auto p-5">

            <button disabled id="addbtn" class="btn btn-primary float-end my-3"> add product</button>
            <div class="clearfix"></div>

            <input id="SearchInput" type="text" placeholder="Search By Name...." class="form-control my-2" >

            <table class="table">
                <thead>
                    <th>name</th>
                    <th>price</th>
                    <th>category</th>
                    <th>description</th>
                    <th></th>
                    <th></th>
                </thead>
                <tbody id="tablebody">

                </tbody>
            </table>

        </div>


      <script src="js/bootstrap.bundle.min.js"></script>
      <script src="js/main.js"></script>
    </body>
